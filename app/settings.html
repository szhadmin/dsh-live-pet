<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>直播宠物 · 设置</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0b1220; --panel: #121a2b; --panel-2: #16203463; --line: #22304a;
    --text: #e8eefb; --dim: #9fb0cc; --accent: #4ea1ff; --ok: #40d18a; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 20% -10%, #17253d, var(--bg));
    color: var(--text); font: 14px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 9; backdrop-filter: blur(8px);
    background: #0b1220d9; border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .5px; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .pill.ok { color: var(--ok); border-color: #2b5c44; }
  .pill.err { color: var(--err); border-color: #5c2b2b; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px 0; }
  nav button {
    background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  nav button.active { color: var(--text); border-color: var(--accent); background: #4ea1ff1f; }
  main { padding: 16px 20px 60px; max-width: 1180px; }
  section.card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  section.card > h2 { font-size: 14px; margin: 0 0 4px; }
  .hint { color: var(--dim); font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px dashed #1d2942; }
  .row:last-child { border-bottom: 0; }
  .label { flex: 0 0 150px; color: #cfdcf3; }
  input[type=text], input[type=number], select, textarea {
    background: #0d1524; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 9px; font: inherit; min-width: 90px;
  }
  input[type=text] { flex: 1 1 220px; }
  textarea { flex: 1 1 100%; min-height: 120px; line-height: 1.6; font-family: Consolas, monospace; font-size: 12.5px; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  button {
    background: #16233a; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 13px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1b66c9; border-color: #2f7fe0; font-weight: 600; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #toast {
    position: fixed; right: 20px; bottom: 20px; max-width: 460px; padding: 10px 14px; border-radius: 10px;
    background: #16233a; border: 1px solid var(--line); box-shadow: 0 8px 24px #0008; display: none; white-space: pre-wrap;
  }
  #toast.ok { border-color: #2b5c44; color: #b9f5d6; }
  #toast.err { border-color: #5c2b2b; color: #ffc9c9; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .chip:hover { border-color: var(--accent); }
  code { background: #0d1524; padding: 1px 6px; border-radius: 6px; font-size: 12px; }
  .muted { color: var(--dim); }
  .hide { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>直播宠物 · 设置</h1>
  <span class="pill" id="version">…</span>
  <span class="pill" id="petState">宠物状态读取中</span>
  <span class="pill" id="sceneState">背景：—</span>
  <span class="pill" id="liveState">直播服务：—</span>
  <span class="pill" id="usagePill">token：—</span>
  <span style="flex:1"></span>
  <button class="ghost" id="refreshAll">刷新</button>
</header>

<nav id="tabs"></nav>
<main id="main"></main>
<div id="toast"></div>

<script>
'use strict'

const state = { pet: null, live: null, liveOk: false, poses: [], skins: [], usage: {}, configFile: '', appHome: '', activeTab: 'pet' }

/* ------------------------------------------------------------------ 小工具 */
const $ = (sel) => document.querySelector(sel)
const el = (tag, props = {}, ...kids) => {
  const node = document.createElement(tag)
  for (const [key, value] of Object.entries(props)) {
    if (key === 'class') node.className = value
    else if (key === 'text') node.textContent = value
    else if (key === 'html') node.innerHTML = value
    else if (key.startsWith('on')) node.addEventListener(key.slice(2).toLowerCase(), value)
    else if (value !== undefined && value !== null) node.setAttribute(key, value)
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue
    node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid)
  }
  return node
}
let toastTimer = null
function toast(kind, text) {
  const box = $('#toast')
  box.className = kind
  box.textContent = text
  box.style.display = 'block'
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { box.style.display = 'none' }, kind === 'err' ? 9000 : 4000)
}

async function api(path, options) {
  const response = await fetch(path, options)
  const text = await response.text()
  try {
    return JSON.parse(text)
  } catch {
    throw new Error(`返回的不是 JSON：${text.slice(0, 120)}`)
  }
}
const postJson = (path, body) => api(path, {
  method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}),
})

/* ------------------------------------------------------------------ 字段定义 */
const EMOTIONS = ['happy', 'mischievous', 'crying', 'unhappy', 'eating', 'cooking', 'coding', 'tv', 'walking']
const EMOTION_LABELS = {
  happy: '开心', mischievous: '坏笑', crying: '哭', unhappy: '不高兴', eating: '吃东西',
  cooking: '做饭', coding: '敲电脑', tv: '躺沙发看电视', walking: '走路',
}
const EMOTION_OPTIONS = EMOTIONS.map((value) => [value, `${EMOTION_LABELS[value]}（${value}）`])
const FX_OPTIONS = [['none', '不动'], ['squash', '挤压'], ['firework', '放烟花'], ['shake', '抖一抖'], ['spin', '转个身'], ['hop', '蹦一下']]

const SECTIONS = [
  {
    id: 'pet', title: '宠物', hint: '这些只影响宠物自己，保存后立刻生效。',
    fields: [
      { key: 'petName', label: '宠物名字', type: 'text', placeholder: '大肥鲸', hint: '弹幕池署名、气泡落款用' },
      { key: 'profile', label: 'DSH profile', type: 'text', hint: 'pet = 插件生成的只读档' },
      { key: 'mode', label: '对话模式', type: 'select', options: [['auto', 'auto 全自动'], ['takeover', 'takeover 接管'], ['mirror', 'mirror 镜像']] },
      { key: 'persona', label: '人设', type: 'textarea', hint: '留空用内置人设；保存后会重建 pet profile，下一轮生效' },
      { key: 'speak', label: '合成语音', type: 'bool' },
      { key: 'chatEnabled', label: '接受打字聊天', type: 'bool' },
      { key: 'petSilent', label: '静音启动', type: 'bool' },
      { key: 'autoStartPet', label: '启动时自动开宠物窗口', type: 'bool' },
      { key: 'eyesEnabled', label: '给它装眼睛（随时知道桌面在干嘛）', type: 'bool', hint: '开着的时候你问「你在干嘛」，它能直接答出你在打什么游戏、开什么软件' },
      { key: 'eyesEverySec', label: '隔多久看一眼（秒）', type: 'number', hint: '默认 90 秒；画面没变会自动跳过，不白烧 token' },
      { key: 'eyesWidth', label: '看图清晰度（宽度像素）', type: 'number', hint: '默认 700；调大看得更细，也更贵' },
      { key: 'maxChars', label: '弹幕回复字数', type: 'number', hint: '老板打字的回复上限见下一个' },
      { key: 'chatMaxChars', label: '打字回复字数', type: 'number' },
      { key: 'timeoutMs', label: '单轮超时（ms）', type: 'number' },
    ],
  },
  {
    id: 'game',
    title: '小海豚游戏机',
    hint: '真·植物大战僵尸（开源复刻，原版素材）：观众说「玩个游戏」，小海豚就自己开一局——攒阳光、种向日葵、补豌豆、上坚果、丢樱桃炸弹，边打边解说。游戏窗口会钉在桌面右上方，第一次跑会自动下载游戏本体（约 7MB）。',
    fields: [
      { key: 'gameModeEnabled', label: '开游戏模式', type: 'bool', hint: '弹幕或你自己说「玩个游戏」就开一局；同一个口令不会打断正在打的那局' },
      { key: 'gameModeVoice', label: '开局/过关/结束要出声', type: 'bool', hint: '关掉只弹气泡，不合成语音（省 TTS 时间）' },
      { key: 'gameModeQuipEverySec', label: '边打边吐槽的间隔（秒）', type: 'number', hint: '默认 9 秒一句，只弹气泡不发音' },
      { key: 'gameLevel', label: '打第几关', type: 'number', hint: '0~5：1 是白天前院（默认），数字越大僵尸越猛' },
      { key: 'gamePort', label: '游戏接口端口', type: 'number', hint: '默认 8794 本机回环；被占就换一个' },
      { key: 'gamePos', label: '窗口位置 x,y', type: 'text', hint: '默认 1080,180（右上角），窗口会钉在最上层' },
    ],
  },
  {
    id: 'interact', title: '互动', hint: '弹幕、进场、礼物的反应节奏。',
    fields: [
      { key: 'idleChat', label: '冷场自己找话题', type: 'bool' },
      { key: 'idleEverySec', label: '冷场多少秒说一句', type: 'number' },
      { key: 'welcomeEnter', label: '欢迎进场', type: 'bool' },
      { key: 'welcomeEnterGapSec', label: '进场：批量窗口（秒）', type: 'number' },
      { key: 'welcomeEnterPerHour', label: '进场：每小时上限', type: 'number' },
      { key: 'welcomeEnterUserGapSec', label: '进场：同一人冷却（秒）', type: 'number' },
      { key: 'thanksGift', label: '感谢礼物', type: 'bool' },
      { key: 'giftThanksGapSec', label: '礼物：间隔（秒）', type: 'number' },
      { key: 'giftThanksUserGapSec', label: '礼物：同一人冷却（秒）', type: 'number' },
      { key: 'thanksFollow', label: '感谢关注', type: 'bool' },
      { key: 'thanksLike', label: '感谢点赞', type: 'bool' },
      { key: 'allowSkip', label: '允许切歌', type: 'bool' },
      { key: 'skipCooldownSec', label: '切歌冷却（秒）', type: 'number' },
      { key: 'maxPerMinute', label: '限流：条/分钟', type: 'number' },
      { key: 'minReplyGapMs', label: '限流：最小间隔（ms）', type: 'number' },
      { key: 'queryEmotion', label: '查东西时的情绪', type: 'select', options: EMOTION_OPTIONS },
      { key: 'songEmotion', label: '点歌时的情绪', type: 'select', options: EMOTION_OPTIONS },
      { key: 'giftForcedEmotion', label: '礼物固定表情', type: 'select', options: [['', '按礼物规则']].concat(EMOTION_OPTIONS) },
      { key: 'giftPoseSec', label: '礼物表情持续（秒）', type: 'number' },
      { key: 'actions', label: '允许点歌/礼物动作', type: 'bool' },
      { key: 'stageGiftFx', label: '礼物特效转发给舞台', type: 'bool' },
    ],
  },
]

const TEAM_FIELDS = [
  { key: 'enabled', label: '开启连麦', type: 'bool', hint: '让主宠物和另一个 AI 互相说话' },
  { key: 'audienceJoin', label: '观众弹幕能插话', type: 'bool', hint: '弹幕优先，A 回完观众 B 再顺口接一句' },
  { key: 'mode', label: '关系', type: 'select', options: [['argue', '互相抬杠（吵架）'], ['chat', '搭子闲聊']] },
  { key: 'nameB', label: '对方名字', type: 'text', placeholder: '小海豚' },
  { key: 'personaB', label: '对方人设', type: 'textarea', hint: '留空用内置「抬杠搭子」人设' },
  { key: 'profileB', label: '对方 DSH profile', type: 'text', hint: '留空 = 跟主宠物同一个 profile，只隔离会话' },
  { key: 'idleStartSec', label: '冷场多少秒开聊', type: 'number' },
  { key: 'turnGapSec', label: '每句间隔（秒）', type: 'number' },
  { key: 'roundsPerBurst', label: '一波最多几轮', type: 'number' },
  { key: 'quietSec', label: '聊完歇多久（秒）', type: 'number' },
  { key: 'showPetB', label: 'B 也出镜', type: 'bool', hint: '开 = 连麦时两只都出现（开了背景就画在背景里，没开背景 B 自己一个窗口）；关 = 只留 A，B 的话显示在 A 的气泡里' },
]

/* ------------------------------------------------------------------ 渲染器 */
function fieldRow(field, value, onChange, hintOverride) {
  const hint = hintOverride || field.hint
  let control
  if (field.type === 'bool') {
    control = el('label', { class: 'check' },
      el('input', { type: 'checkbox', checked: value === true, onchange: (event) => onChange(event.target.checked) }),
      el('span', { text: '开' }))
  } else if (field.type === 'select') {
    control = el('select', { onchange: (event) => onChange(event.target.value) },
      (field.options || []).map(([optionValue, label]) => el('option', { value: optionValue, text: label })))
    control.value = value === undefined || value === null ? '' : String(value)
  } else if (field.type === 'number') {
    control = el('input', { type: 'number', value: value === undefined || value === null ? '' : String(value), onchange: (event) => onChange(event.target.value === '' ? '' : Number(event.target.value)) })
  } else if (field.type === 'textarea') {
    control = el('textarea', { placeholder: field.placeholder || '', onchange: (event) => onChange(event.target.value) })
    control.value = value === undefined || value === null ? '' : String(value)
  } else {
    control = el('input', { type: 'text', value: value === undefined || value === null ? '' : String(value), placeholder: field.placeholder || '', oninput: (event) => onChange(event.target.value) })
  }
  return el('div', { class: 'row' },
    el('span', { class: 'label', text: field.label }),
    control,
    hint ? el('span', { class: 'hint', text: hint }) : null)
}

async function savePet(patch, okText) {
  const payload = await postJson('/dsh-live-pet/config', { pet: patch })
  if (payload.petSaved === true) {
    state.pet = payload.pet || state.pet
    toast('ok', okText || '宠物设置已保存')
    render()
    return true
  }
  toast('err', payload.error || '保存失败')
  return false
}

function render() {
  const tabs = [
    ...SECTIONS.map((section) => [section.id, section.title]),
    ['model', '模型'],
    ['scene', '直播背景'],
    ['skin', '形象'],
    ['poses', '动作'],
    ['team', '双智能体'],
    ['usage', '用量'],
    ['live', '直播服务'],
    ['paths', '路径'],
    ['advanced', '其它'],
  ]
  const nav = $('#tabs')
  nav.innerHTML = ''
  for (const [id, label] of tabs) {
    nav.appendChild(el('button', {
      class: state.activeTab === id ? 'active' : '',
      text: label,
      onclick: () => { state.activeTab = id; render() },
    }))
  }

  const main = $('#main')
  main.innerHTML = ''
  const definition = SECTIONS.find((section) => section.id === state.activeTab)
  if (definition) main.appendChild(renderSimpleSection(definition))
  else if (state.activeTab === 'model') main.appendChild(renderModel())
  else if (state.activeTab === 'scene') main.appendChild(renderScene())
  else if (state.activeTab === 'skin') main.appendChild(renderSkin())
  else if (state.activeTab === 'poses') main.appendChild(renderPoses())
  else if (state.activeTab === 'team') main.appendChild(renderTeam())
  else if (state.activeTab === 'usage') main.appendChild(renderUsage())
  else if (state.activeTab === 'live') main.appendChild(renderLive())
  else if (state.activeTab === 'paths') main.appendChild(renderPaths())
  else main.appendChild(renderAdvanced())
}

/* --------------------------------------------------------------- 形象包 */
function renderSkin() {
  const active = state.skins.find((skin) => skin.active === true)
  const card = el('section', { class: 'card' },
    el('h2', { text: '宠物形象（可换成自己的动图）' }),
    el('div', { class: 'hint', text: '把 GIF 丢进一个文件夹，文件名就是情绪名：happy.gif / crying.gif / coding.gif …（9 个情绪名见下）。缺哪个情绪会自动用内置那套，所以先只放 happy.gif 也能跑。' }),
    el('div', { class: 'row' },
      el('span', { class: 'label', text: '当前形象' }),
      el('span', { class: 'pill ok', text: active ? active.name : '内置（大肥鲸）' }),
      el('code', { text: state.pet && state.pet.skinDir ? state.pet.skinDir : '（内置 frames）' })),
    el('div', { class: 'actions' },
      el('button', { text: '刷新列表', onclick: () => refreshSkins() }),
      el('button', { text: '建一个形象文件夹', onclick: () => createSkin() }),
      el('button', { class: 'ghost', text: '打开形象目录', onclick: () => openSkinFolder('') }),
      el('button', { class: 'primary', text: '恢复内置形象', onclick: () => savePet({ skinDir: '' }, '已恢复内置形象（窗口会重启一次）') })))

  const list = el('section', { class: 'card' },
    el('h2', { text: '可用形象' }),
    state.skins.length === 0
      ? el('div', { class: 'hint', text: 'skins 目录还是空的。点上面「建一个形象文件夹」，把 GIF 放进去再来这里选。' })
      : null)
  for (const skin of state.skins) {
    const emotions = Object.keys(skin.emotions || {})
    const box = el('div', { class: 'row' },
      el('span', { class: 'label', text: skin.name }),
      el('span', { class: 'pill ' + (skin.active ? 'ok' : ''), text: `${skin.count}/9 情绪` }),
      el('span', { class: 'hint', text: emotions.length === 0 ? '（没有可识别的 GIF/PNG）' : emotions.join(' · ') }),
      el('button', { text: skin.active ? '正在用' : '用这个形象', disabled: skin.active ? 'disabled' : undefined,
        onclick: () => savePet({ skinDir: skin.dir }, `形象切换到「${skin.name}」（窗口会重启一次）`) }),
      el('button', { class: 'ghost', text: '打开', onclick: () => openSkinFolder(skin.dir) }))
    list.appendChild(box)
  }

  const help = el('section', { class: 'card' },
    el('h2', { text: '情绪名（文件名要用这些）' }),
    el('div', { class: 'hint', text: EMOTIONS.map((name) => `${name}.gif（${EMOTION_LABELS[name]}）`).join('　') }))
  return el('div', {}, card, list, help)
}

async function refreshSkins() {
  try {
    const payload = await api('/dsh-live-pet/skins')
    state.skins = Array.isArray(payload.skins) ? payload.skins : []
    state.builtinFrames = payload.builtin || ''
    render()
  } catch (error) {
    toast('err', '读形象列表失败：' + (error && error.message ? error.message : error))
  }
}

async function createSkin() {
  const name = window.prompt('形象叫什么？（会建一个文件夹，比如 小海豚）', '我的形象')
  if (!name) return
  const result = await postJson('/dsh-live-pet/skins/create', { name })
  if (result.ok === true) {
    toast('ok', `已建好：${result.dir}\n把 happy.gif 之类的动图放进去，再回来点「刷新列表」`)
    await refreshSkins()
    await openSkinFolder(result.dir)
  } else {
    toast('err', result.error || '创建失败')
  }
}

async function openSkinFolder(dir) {
  const result = await postJson('/dsh-live-pet/skins/open', { dir: dir || '' })
  if (result.ok !== true) toast('err', result.error || '打不开目录')
}

/* --------------------------------------------------------------- token 用量 */
function renderUsage() {
  const usage = state.usage || {}
  const card = el('section', { class: 'card' },
    el('h2', { text: 'Token 用量' }),
    el('div', { class: 'hint', text: '每轮从 DSH 的 --json 输出里取 usage 累加（input / output / cache 读），重启插件也接着记。' }))
  const rows = [
    ['总 token', usage.total || 0],
    ['输入 token', usage.input || 0],
    ['输出 token', usage.output || 0],
    ['缓存命中读取', usage.cacheRead || 0],
    ['回合数', usage.turns || 0],
    ['　主宠物 A', usage.turnsA || 0],
    ['　搭子 B', usage.turnsB || 0],
    ['平均每轮', usage.avgPerTurn || 0],
    ['平均每分钟（从开始统计算）', `${usage.perMinute || 0} tok/min`],
  ]
  for (const [label, value] of rows) {
    card.appendChild(el('div', { class: 'row' },
      el('span', { class: 'label', text: label }),
      el('code', { text: String(value) })))
  }
  card.appendChild(el('div', { class: 'row' },
    el('span', { class: 'label', text: '最后一轮' }),
    el('span', { class: 'hint', text: usage.last
      ? `${usage.last.slot === 'b' ? 'B' : 'A'} · 输入 ${usage.last.input} / 输出 ${usage.last.output} / 合计 ${usage.last.total}（${usage.lastAtText || ''}）`
      : '还没有数据' }),

    el('span', { class: 'hint', text: usage.sinceText || '—' })))

}

async function refreshUsage() {
  try {

/** 上面没做成表单的直播设置：原样给个 JSON 编辑器，保证「设置都迁过来」不漏项 */
function renderLiveExtra(live) {
  const COVERED = new Set([
    'douyin', 'songs', 'voice', 'rate', 'pitch', 'has_key', 'key_hint',
    'persona_default', 'persona_is_default',
  ])
  const rest = {}
  for (const [key, value] of Object.entries(live)) if (!COVERED.has(key)) rest[key] = value

  const card = el('section', { class: 'card' },
    el('h2', { text: '其它直播设置（JSON）' }),
    el('div', { class: 'hint', text: '模型、人设、记忆、工具开关、空闲/宣传、礼物动作这些原样放在这里，改完点保存。' }))
  const area = el('textarea', { spellcheck: 'false' })
  area.value = JSON.stringify(rest, null, 2)
  card.appendChild(area)
  card.appendChild(el('div', { class: 'actions' },
    el('button', { class: 'primary', text: '保存其它直播设置', onclick: async () => {
      let parsed
      try {
        parsed = JSON.parse(area.value)
      } catch (error) {
        toast('err', 'JSON 语法错误：' + (error && error.message ? error.message : error))
        return
      }
      await saveLive('extra', parsed)
    } })))
  return card
}

async function saveLive(group, payload) {
  try {
    const result = await postJson('/dsh-live-pet/config', { live: payload })
    if (result.liveSaved === true) {
      state.live = result.live && result.live.settings ? result.live.settings : state.live
      toast('ok', '已写入直播服务')
      render()
    } else {
      toast('err', result.liveError || '直播服务没有确认保存')
    }
  } catch (error) {
    toast('err', '保存失败：' + (error && error.message ? error.message : error))
  }
}

async function controlLive(action) {
  try {
    toast('ok', `正在 ${action} 直播服务…`)
    const result = await postJson('/dsh-live-pet/live', { action })
    toast(result.ok === false ? 'err' : 'ok', result.ok === false ? (result.error || '失败') : `直播服务已 ${action}`)
    setTimeout(refreshAll, 2500)
  } catch (error) {
    toast('err', String(error && error.message ? error.message : error))
  }
}

async function checkDeps() {
  const result = await api('/dsh-live-pet/deps')
  const missing = Array.isArray(result.missing) ? result.missing : []
  toast(missing.length === 0 ? 'ok' : 'err', missing.length === 0 ? '依赖齐全' : '缺少：' + missing.join('、'))
}

async function installDeps() {
  toast('ok', '开始装 Python 依赖，可能要一两分钟…')
  const result = await postJson('/dsh-live-pet/deps', { action: 'install' })
  toast(result.ok === false ? 'err' : 'ok', result.ok === false ? (result.error || '安装失败') : '依赖已安装')
}

/* ------------------------------------------------------------------ 高级 */
function renderAdvanced() {
  const known = new Set([
    'provider', 'model', 'baseUrl', 'apiKey', 'apiKeyEnv', 'speak', 'ttsVoice', 'ttsRate', 'ttsPitch',
    'dshBin', 'nodeBin', 'pythonBin', 'workspace', 'liveBaseDir', 'liveHost', 'livePort', 'liveMode',
    'appUrl', 'manageLive', 'autoStartLive', 'liveStartTimeoutSec', 'appPort', 'audioDir', 'skinDir',
  ])
  for (const section of SECTIONS) for (const field of section.fields) known.add(field.key)
  const card = el('section', { class: 'card' },
    el('h2', { text: '其它设置（高级）' }),
    el('div', { class: 'hint', text: '上面几页没覆盖到的项，在这里直接改。数字/开关会自动识别，其它按文本处理。' }))
  const draft = {}
  for (const [key, value] of Object.entries(state.pet || {})) {
    if (known.has(key)) continue
    if (key === 'multiAgent' || key === 'posesCustom') continue
    if (typeof value === 'object' && value !== null) continue
    const type = typeof value === 'boolean' ? 'bool' : (typeof value === 'number' ? 'number' : 'text')
    draft[key] = value
    card.appendChild(fieldRow({ key, label: key, type }, value, (next) => { draft[key] = next }))
  }
  card.appendChild(el('div', { class: 'actions' },
    el('button', { class: 'primary', text: '保存这些', onclick: () => savePet(draft, '已保存') })))

  const paths = el('section', { class: 'card' },
    el('h2', { text: '位置' }),
    el('div', { class: 'row' }, el('span', { class: 'label', text: 'config.json' }), el('code', { text: state.configFile || '—' })),
    el('div', { class: 'row' }, el('span', { class: 'label', text: 'pet profile' }), el('code', { text: (state.pet && state.pet.profile) || 'pet' })))
  return el('div', {}, card, paths)
}

/* ------------------------------------------------------------------ 数据 */
async function loadPoses() {
  try {
    const payload = await api('/dsh-live-pet/poses')
    state.poses = Array.isArray(payload.poses) ? payload.poses : []
  } catch {
    state.poses = []
  }
}

async function refreshAll() {
  try {
    const payload = await api('/dsh-live-pet/config')
    state.pet = payload.pet || {}
    state.live = payload.live && payload.live.settings ? payload.live.settings : null
    state.liveOk = Boolean(payload.live && payload.live.ok)
    state.configFile = payload.configFile || ''
    await loadPoses()
    try {
      const skinsPayload = await api('/dsh-live-pet/skins')
      state.skins = Array.isArray(skinsPayload.skins) ? skinsPayload.skins : []
      state.builtinFrames = skinsPayload.builtin || ''
    } catch { state.skins = [] }
    try {
      const usagePayload = await api('/dsh-live-pet/usage')
      state.usage = usagePayload.usage || {}
    } catch { state.usage = {} }
    render()
  } catch (error) {
    toast('err', '读取配置失败：' + (error && error.message ? error.message : error))
  }
  refreshStatus()
}

async function refreshStatus() {
  try {
    const health = await api('/health')
    $('#version').textContent = 'v' + health.version
    state.appHome = health.home || ''
  } catch { /* 无所谓 */ }
  try {
    const statePayload = await api('/dsh-live-pet/state')
    const status = String(statePayload.status || '')
    const emotion = String(statePayload.emotion || '')
    $('#petState').textContent = `宠物：${status || '?'} · ${EMOTION_LABELS[emotion] || emotion || '?'}`
    $('#petState').className = 'pill ' + (status === 'offline' ? 'err' : 'ok')
    const display = statePayload.scene ? String(statePayload.scene.display || '') : ''
    const sceneText = display === 'full' ? '全屏背景' : display === 'minimal' ? '最小化（只留宠物）' : '已关闭'
    $('#sceneState').textContent = '背景：' + sceneText
    if (statePayload.config && statePayload.config.multiAgent === true) {
      $('#sceneState').textContent += ` · 连麦中（${statePayload.config.agentB || 'B'}）`
    }
  } catch {
    $('#petState').textContent = '宠物状态：读不到'
    $('#petState').className = 'pill err'
  }
  try {
    const usagePayload = await api('/dsh-live-pet/usage')
    const usage = usagePayload.usage || {}
    state.usage = usage
    document.getElementById('usagePill').textContent =
      'token：' + (usage.total || 0).toLocaleString('zh-CN') + ' · ' + (usage.turns || 0) + ' 轮'
  } catch { /* 用量读不到不影响 */ }
  try {
    const live = await api('/dsh-live-pet/live')
    const running = live && live.status && (live.status.running === true || live.status.ok === true)
    $('#liveState').textContent = '直播服务：' + (running ? `运行中 ${live.status.port || ''}`.trim() : '未运行')
    $('#liveState').className = 'pill ' + (running ? 'ok' : '')
  } catch {
    $('#liveState').textContent = '直播服务：读不到'
    $('#liveState').className = 'pill err'
  }
}

$('#refreshAll').addEventListener('click', () => refreshAll())
refreshAll()
setInterval(refreshStatus, 4000)
</script>
</body>
