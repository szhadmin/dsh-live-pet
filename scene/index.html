<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>直播场景</title>
<style>
  :root {
    --pool-font: 20px;
    --panel-bg: rgba(12, 20, 32, 0.55);
    --panel-border: rgba(255, 255, 255, 0.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1220;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    cursor: none;
  }
  #bg {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  /* 让文字在亮背景上也读得清 */
  #bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 100%, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0) 60%),
      linear-gradient(180deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.34));
  }

  .panel {
    position: fixed;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    backdrop-filter: blur(10px) saturate(1.15);
    -webkit-backdrop-filter: blur(10px) saturate(1.15);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    color: #eaf2ff;
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px 10px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  .panel-head .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 10px #4ade80;
  }
  .panel-head .count {
    margin-left: auto;
    font-size: 14px;
    font-weight: 400;
    color: rgba(234, 242, 255, 0.6);
  }

  /* ── 左上角：弹幕池 ───────────────────────────── */
  #pool {
    left: 28px;
    top: 26px;
    width: 620px;
    height: 560px;
    display: flex;
    flex-direction: column;
  }
  #poolList {
    flex: 1;
    padding: 4px 20px 18px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    font-size: var(--pool-font);
    line-height: 1.45;
    overflow: hidden;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: baseline;
    animation: pop 0.32s ease-out;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .who {
    flex: none;
    max-width: 40%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
    color: #7fd4ff;
  }
  .say { flex: 1; word-break: break-word; color: #f2f7ff; }
  .row.gift .who { color: #ffd166; }
  .row.gift .say { color: #ffe6a3; }
  .row.enter .who { color: #b9c6d6; font-weight: 400; }
  .row.enter .say { color: #9fb0c4; font-size: 0.86em; }
  .row.me .who { color: #9dffd0; }
  .row.me .say { color: #d6ffe9; }

  /* ── 右上角：点歌台 ───────────────────────────── */
  #songs {
    right: 28px;
    top: 26px;
    width: 380px;
    max-height: 560px;
    display: flex;
    flex-direction: column;
  }
  #nowPlaying {
    padding: 2px 20px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  #nowTitle {
    font-size: 22px;
    font-weight: 600;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #nowArtist {
    margin-top: 4px;
    font-size: 14px;
    color: rgba(234, 242, 255, 0.72);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #nowBar {
    margin-top: 10px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.16);
    overflow: hidden;
  }
  #nowBarFill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    background: linear-gradient(90deg, #4ade80, #38bdf8);
    transition: width 0.5s linear;
  }
  #queue {
    padding: 12px 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    font-size: 17px;
    overflow: hidden;
  }
  .q {
    display: flex;
    gap: 10px;
    align-items: baseline;
    color: #e7f0ff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
  }
  .q .idx {
    flex: none;
    width: 22px;
    color: rgba(234, 242, 255, 0.55);
    font-size: 14px;
  }
  .q .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: rgba(234, 242, 255, 0.55); font-size: 16px; }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div id="bg"></div>

  <div class="panel" id="pool">
    <div class="panel-head"><span class="dot"></span>弹幕池<span class="count" id="poolCount"></span></div>
    <div id="poolList"></div>
  </div>

  <div class="panel" id="songs">
    <div class="panel-head"><span class="dot" style="background:#38bdf8;box-shadow:0 0 10px #38bdf8"></span>点歌台</div>
    <div id="nowPlaying">
      <div id="nowTitle">还没有歌</div>
      <div id="nowArtist"></div>
      <div id="nowBar"><div id="nowBarFill"></div></div>
    </div>
    <div id="queue"><div class="empty">队列空着</div></div>
  </div>

  <div id="hint">弹幕池 · 点歌台 · 宠物会在这块背景里走动</div>

<script>
  const POOL_MAX = 12
  const state = { pool: [], songs: null, renderedSeq: -1 }

  function esc(text) {
    return String(text === undefined || text === null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  }

  function renderPool(items, font) {
    const list = document.getElementById('poolList')
    if (font) document.documentElement.style.setProperty('--pool-font', font + 'px')
    const tail = items.slice(-POOL_MAX)
    list.innerHTML = tail.map((item) => {
      const kind = item.kind === 'gift' ? 'gift' : item.kind === 'enter' ? 'enter' : item.kind === 'me' ? 'me' : ''
      const who = item.kind === 'enter' ? (item.user || '有人') : (item.user || '观众')
      const say = item.kind === 'enter' ? '进来了' : esc(item.text || '')
      return '<div class="row ' + kind + '"><span class="who">' + esc(who) + '</span><span class="say">' + say + '</span></div>'
    }).join('')
    document.getElementById('poolCount').textContent = items.length > 0 ? items.length + ' 条' : ''
  }

  function renderSongs(songs) {
    const boxes = document.getElementById('queue')
    if (!songs) {
      document.getElementById('nowTitle').textContent = '还没有歌'
      document.getElementById('nowArtist').textContent = ''
      document.getElementById('nowBarFill').style.width = '0%'
      boxes.innerHTML = '<div class="empty">队列空着</div>'
      return
    }
    const playing = songs.playing === true && String(songs.title || '') !== ''
    document.getElementById('nowTitle').textContent = playing ? String(songs.title) : '还没放歌'
    document.getElementById('nowArtist').textContent = playing ? String(songs.artist || '') : '喊首歌名，我就给你点上'
    const len = Number(songs.len) || 0
    const pos = Number(songs.position) || 0
    const pct = len > 0 ? Math.max(0, Math.min(100, (pos / len) * 100)) : 0
    document.getElementById('nowBarFill').style.width = pct.toFixed(1) + '%'
    const queue = Array.isArray(songs.queue) ? songs.queue.slice(0, 5) : []
    if (queue.length === 0) {
      boxes.innerHTML = '<div class="empty">队列空着</div>'
      return
    }
    boxes.innerHTML = queue.map((song, index) =>
      '<div class="q"><span class="idx">' + (index + 1) + '</span><span class="t">' + esc(song.title || '') + '</span></div>'
    ).join('')
  }

  function applyBackground(url) {
    const bg = document.getElementById('bg')
    if (url) bg.style.backgroundImage = 'url("' + url + '")'
  }

  let lastPoolAt = 0
  async function tick() {
    try {
      const payload = await (await fetch('/dsh-live-pet/state?scene=1', { cache: 'no-store' })).json()
      const scene = payload.scene || {}
      if (scene.imageUrl) applyBackground(scene.imageUrl)
      const pool = Array.isArray(payload.pool) ? payload.pool : []
      renderPool(pool, scene.poolFontSize)
      const songs = payload.songs || (payload.live && payload.live.songs) || null
      renderSongs(songs)
      lastPoolAt = Date.now()
    } catch (error) {
      document.getElementById('hint').textContent = '场景数据拉取失败，正在重试…'
    }
  }

  tick()
  setInterval(tick, 1200)
</script>
</body>
</html>
